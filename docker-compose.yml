# Tournament server compose. Setup, firewall and logs: see deploy/README.md.
# Settings come from .env next to this file (copy .env.example).
services:
  socket:
    build:
      context: .
      dockerfile: Dockerfile
    # Write all output to /logs/server.log as well as `docker compose logs`.
    # `exec` keeps node as the main process so `docker compose stop` shuts it down cleanly.
    command: ["bash", "-c", "exec node dist/main.js > >(tee -a /logs/server.log) 2>&1"]
    ports:
      # Game port: players connect here
      - "8788:8788"
      # Admin HTTP API (tourney commands, used by the bot). Set ADMIN_HTTP_BIND in .env to
      # the address the proxy/bot reach; the firewall limits who can connect. Defaults to
      # loopback, i.e. not reachable from other machines.
      - "${ADMIN_HTTP_BIND:-127.0.0.1}:8790:8790"
    environment:
      # Shared secret for the admin CLI and HTTP API. The HTTP API is disabled when empty.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Tourney switches/seed/loadout, persisted so a restart keeps them.
      TOURNEY_STATE_PATH: /data/tourney.json
      NODE_ENV: development
      # Replay-log hash store and ban list (better-sqlite3), on the data volume.
      LOG_HASH_DB_PATH: /data/log_hashes.db
      # Abuse rate-heuristic disconnects + auto-bans. Players must connect directly (not
      # through a proxy): bans are per IP, so behind a proxy one bad client bans everyone.
      ABUSE_ENFORCE: "true"
    restart: unless-stopped
    # Resource caps so an abuse spike can't take down the whole host.
    mem_limit: 512m
    cpus: "1.5"
    pids_limit: 512
    # The real log is /logs/server.log (rotated by deploy/logrotate/balatro-server-log);
    # keep Docker's own copy small so it can't fill the container's disk.
    logging:
      driver: local
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ${LOGS_DIR:-./logs}:/logs
      - ${DATA_DIR:-./data}:/data
